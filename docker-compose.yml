version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sovereign_postgres
    environment:
      POSTGRES_DB: sovereign_db
      POSTGRES_USER: sovereign_user
      POSTGRES_PASSWORD: sovereign_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sovereign_user -d sovereign_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: sovereign_vector_db
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sovereign_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./sovereign_workbench.db
      - OFFLINE_MODE=true
      - SANDBOX_ENABLED=true
      - SANDBOX_NETWORK_DISABLED=true
    depends_on:
      - postgres
      - qdrant
    volumes:
      - ./backend/storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sovereign_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:
